<script>
const ROCKETS = [{name:'Atlas V 541',program:'NASA · MSL / Curiosity',year:2011,id:'atlas-v-541',file:'06-atlas.svg',engines:2}];
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const meta=document.getElementById('rocketMeta'),counter=document.getElementById('counter'),statusEl=document.getElementById('missionStatus'),hint=document.getElementById('hint');
const overlay=document.getElementById('overlay'),obig=document.getElementById('overlayBig'),osub=document.getElementById('overlaySub'),resultBtns=document.getElementById('resultBtns');
const prevBtn=document.getElementById('prevBtn');
const profiles=[
  {name:'ЛЕГКО', thrust:155, drag:.95, width:.13},
  {name:'ОБЫЧНО', thrust:130, drag:.97, width:.105},
  {name:'СЛОЖНО', thrust:105, drag:.98, width:.085}
];
const profile=()=>profiles[selected%profiles.length];
const action=document.getElementById('missionAction');
let actionHeld=false, actionPress=false, ascent=0, climb=0, fuel=1, burn=1, packets=0, touchdown=0, nextBeat=0, beat=0;
const camera=createFlightCamera(), effects=createFlightParticles();
let cameraOffset={x:0,y:0}, rcsTurn=0, rcsActivity=0, reentrySpeed=0;
const dynamics=createFlightDynamics(), sas=document.getElementById("sas");
let machPassed=false;
let stage=0, debris=[], pointer=null, audio, engineAudio;
let W=0,H=0,dpr=1,selected=0,state='IDLE',last=0,elapsed=0,phaseTime=0,rocketY=0,rocketX=0,vx=0,vy=0,tilt=0,cam=0,sound=true,keys={},groundX=0,landingPadX=0;
const images=ROCKETS.map(r=>{let im=new Image();im.src='assets/rockets/'+r.file;return im});
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);groundX=H*.83;landingPadX=W*.5}
addEventListener('resize',resize);resize();
function setState(s){state=s;statusEl.textContent=s.replaceAll('_',' ');hint.textContent=s==='MANUAL_CONTROL'?'КРАЯ ЭКРАНА — РУЛЬ':'ЛИСТАЙТЕ ДЛЯ ВЫБОРА';}
const historyToggle=document.getElementById('historical-mode-toggle');
const historyPanel=document.getElementById('historyPanel');
const historyTitle=document.getElementById('historyTitle');
const historyInfo=document.getElementById('historyInfo');
const historyById=new Map(HISTORICAL_ROCKETS.map(r=>[r.id,r]));
let historicalMode=historyToggle.checked, rolloutStart=0, flightEvents=[], droppedMass=0, thrustBlend=1, completedRecovery;
const historical=()=>historicalMode?historyById.get(ROCKETS[selected].id):undefined;
const eventCount=()=>flightEvents.length;
const recovery=()=>state==='ROLLOUT'||state==='SUCCESS'||state==='FAILED' ? completedRecovery : historical()?.landingSite;
function updateMeta(){
  const r=ROCKETS[selected], info=historical();
  meta.textContent='Atlas V 541 · ULA · марсоход NASA Curiosity';
  counter.textContent='ЗЕМЛЯ → МАРС';
  updateHistoricalHUD();
}
function updateHistoricalHUD(){
  const info=historical();
  historyPanel.hidden=!historicalMode;
  if(!historicalMode)return;
  if(!info){
    historyTitle.textContent=ROCKETS[selected].name;
    historyInfo.textContent='Отдельного профиля нет. Используются стандартные игровые параметры.';
    return;
  }
  historyTitle.textContent=info.name;
  historyInfo.textContent='Визуальный профиль. Даты, места и характеристики старого каталога требуют проверки. Физика и возвращение условные.';
}
function select(n){
  if(!['IDLE','SUCCESS','FAILED'].includes(state))return;
  selected=(n+ROCKETS.length)%ROCKETS.length;
  updateMeta();enter('IDLE');overlay.classList.remove('show');
  document.getElementById('startBtn').style.display='';
  document.getElementById('nextBtn').disabled=prevBtn.disabled=false;
}
historyToggle.addEventListener('change',()=>{
  historicalMode=historyToggle.checked;
  historyPanel.open=historicalMode&&W>650;
  updateMeta();
});
function showOverlay(big,sub='',buttons=[]){obig.textContent=big;osub.textContent=sub;resultBtns.innerHTML='';buttons.forEach(([label,fn,primary])=>{let b=document.createElement('button');b.className='btn '+(primary?'primary':'');b.textContent=label;b.onclick=fn;resultBtns.appendChild(b)});overlay.classList.add('show');}
function start(){if(state!=='IDLE'&&state!=='SUCCESS'&&state!=='FAILED')return;overlay.classList.remove('show');effects.clear();camera.reset();dynamics.reset();machPassed=false;debris=[];flightEvents=STAGING_PROFILES[ROCKETS[selected].file];droppedMass=0;thrustBlend=1;completedRecovery=undefined;stage=0;ascent=0;climb=0;fuel=1;packets=0;pointer=null;elapsed=0;phaseTime=0;rocketX=worldW*.5;rocketY=launchY();vx=0;vy=0;tilt=0;cam=0;setState('COUNTDOWN');document.getElementById('startBtn').style.display='none';document.getElementById('nextBtn').disabled=prevBtn.disabled=true;enableAudio();countdown();}
let countdownIndex=0;
const countdownLabels=['3','2','1','ПУСК'];
function countdown(){
  countdownIndex=0;
  showOverlay(countdownLabels[0]);
  tick();
}
function updateCountdown(){
  const duration=countdownIndex===3?.45:.85;
  if(phaseTime+1e-10<duration)return;
  phaseTime-=duration;
  countdownIndex++;
  if(countdownIndex===4){
    overlay.classList.remove('show');
    enter('IGNITION');
  }else{
    showOverlay(countdownLabels[countdownIndex]);
    tick();
  }
}
function playScore(){
  if(!sound||!audio||audio.state!=='running'||document.hidden||state==='IDLE')return;
  const now=audio.currentTime;
  if(now<nextBeat)return;
  const orbital=['ORBITAL_INSERTION','DOCKING','TRANSFER','DOCKED'].includes(state);
  const interval=orbital?.55:.36;
  const notes=[45,52,57,60,43,50,55,59,41,48,53,57,43,50,55,62];
  const note=notes[beat++%notes.length];
  nextBeat=now+interval;
  scoreTone(note,now,interval*1.8,.022,orbital?'sine':'triangle');
  if(beat%4===1)scoreTone(note-12,now,interval*4,.028,'sine');
}
function scoreTone(note,time,duration,volume,type){
  const osc=audio.createOscillator(),gain=audio.createGain();
  osc.type=type;
  osc.frequency.value=440*2**((note-69)/12);
  gain.gain.setValueAtTime(.0001,time);
  gain.gain.exponentialRampToValueAtTime(volume,time+.08);
  gain.gain.exponentialRampToValueAtTime(.0001,time+duration);
  osc.connect(gain);
  gain.connect(audio.destination);
  osc.start(time);
  osc.stop(time+duration);
}
function enableAudio(){
  if(!sound)return;
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio)return;
  try {
    audio??=new Audio();
    engineAudio??=createEngineAudio(audio);
    audio.resume().catch(()=>{});
  } catch {
    // Keep the mission playable when the browser cannot initialize audio.
  }
}
function tick(){
  if(!sound||!audio)return;
  const oscillator=audio.createOscillator(),gain=audio.createGain();
  oscillator.frequency.value=620;
  gain.gain.value=.025;
  oscillator.connect(gain);
  gain.connect(audio.destination);
  oscillator.start();
  oscillator.stop(audio.currentTime+.035);
}
function updateEngineAudio(pose){
  if(!sound||!engineAudio||document.hidden)return;
  let thrust=0;
  if(state==='IGNITION')thrust=.78;
  if(state==='ASCENT'&&stage<eventCount())thrust=actionHeld||keys.Space?1:.58;
  if(state==='MANUAL_CONTROL'&&landingPlume)thrust=.68;
  if(state==='DOCKING')thrust=.16*rcsActivity;
  const density=1-FlightAtmosphere.fade(0,.84,pose.altitude/FlightAtmosphere.maxAltitude);
  engineAudio.update(thrust,density);
}
function drawEnvironment(view){
  FlightAtmosphere.drawSky(ctx,W,H,view.altitude);
  const t=view.altitude/FlightAtmosphere.maxAltitude;
  ctx.save();
  ctx.globalAlpha=FlightAtmosphere.fade(.4,.84,t);
  if(ctx.globalAlpha>0)drawEarth();
  ctx.globalAlpha=1;
  FlightAtmosphere.drawClouds(ctx,W,H,view,false);
  ctx.globalAlpha=1-FlightAtmosphere.fade(.06,.46,t);
  ctx.fillStyle='#4d8050';
  ctx.beginPath();
  ctx.moveTo(0,H*.77);
  ctx.quadraticCurveTo(W*.3,H*.67,W*.58,H*.76);
  ctx.quadraticCurveTo(W*.8,H*.68,W,H*.75);
  ctx.lineTo(W,H);
  ctx.lineTo(0,H);
  ctx.fill();
  ctx.fillStyle='#52636c';
  ctx.fillRect(0,H*.84,W,H*.16);
  ctx.fillStyle='#aeb9bd';
  ctx.fillRect(W*.36,H*.82,W*.28,H*.18);
  ctx.restore();
}
const continents=[
  [[-.66,-.65],[-.54,-.81],[-.34,-.85],[-.18,-.74],[-.26,-.64],[-.18,-.51],[-.29,-.44],[-.44,-.57]],
  [[-.29,-.43],[-.13,-.40],[-.07,-.30],[-.17,-.13],[-.23,-.08],[-.24,-.24]],
  [[.08,-.69],[.17,-.81],[.35,-.84],[.51,-.73],[.65,-.68],[.52,-.55],[.35,-.59],[.25,-.49]],
  [[.11,-.63],[.27,-.60],[.34,-.48],[.26,-.29],[.17,-.25],[.09,-.43],[.03,-.52]]
];
function drawEarth(){
  const x=W*.52,y=H*1.13,r=Math.max(W*.55,H*.69);
  const rim=ctx.createRadialGradient(x,y,r*.93,x,y,r*1.065);
  rim.addColorStop(0,'#0755a500');
  rim.addColorStop(.54,'#57d4ffae');
  rim.addColorStop(1,'#54b8ff00');
  ctx.fillStyle=rim;
  ctx.beginPath();
  ctx.arc(x,y,r*1.065,0,Math.PI*2);
  ctx.fill();
  ctx.save();
  const opacity=ctx.globalAlpha;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.clip();
  const ocean=ctx.createLinearGradient(0,y-r,0,y);
  ocean.addColorStop(0,'#45aee1');
  ocean.addColorStop(.45,'#146ca4');
  ocean.addColorStop(1,'#07182f');
  ctx.fillStyle=ocean;
  ctx.fillRect(x-r,y-r,2*r,2*r);
  ctx.fillStyle='#4d9d8e';
  for(const coast of continents){
    ctx.beginPath();
    coast.forEach(([u,v],i)=>{
      const px=x+u*r+Math.sin(last*.00015)*r*.13,py=y+v*r;
      if(i===0)ctx.moveTo(px,py);
      else ctx.lineTo(px,py);
    });
    ctx.closePath();
    ctx.fill();
  }
  for(let i=0;i<20;i++){
    ctx.globalAlpha=opacity*(.12+i%4*.06);
    ctx.fillStyle='#e4f8ff';
    ctx.beginPath();
    ctx.ellipse(x+Math.sin(i*2.4+last*.00013)*r*.91,y-r*(.14+i*.044),
      r*(.035+i%5*.018),r*.009,-.16,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}
function drawRocket(x,y,scale=1,angle=0){let im=images[selected];let w=Math.min(W*.25,110,H*.26)*scale,h=w*2.04;ctx.save();ctx.translate(x,y);ctx.rotate(angle);if(typeof AtlasPortrait!=='undefined'&&AtlasPortrait.ready){ctx.drawImage(AtlasPortrait.canvas,-w/2,-h/2,w,h)}else if(im.complete&&im.naturalWidth){ctx.drawImage(im,-w/2,-h/2,w,h)}else{ctx.fillStyle='white';ctx.fillRect(-10,-50,20,100)}ctx.restore();return {w,h}}
function drawLaunchpad(){const site=historical()?.launchSite;if(site){HistoricalSites.launch(ctx,W,H,site,state,phaseTime);return}let y=H*.83;ctx.fillStyle='#7d898e';ctx.fillRect(0,y,W,H-y);ctx.fillStyle='#c5cdd0';ctx.fillRect(W*.28,y-7,W*.44,8);ctx.fillStyle='#384650';ctx.fillRect(W*.47,y-2,W*.06,12);ctx.strokeStyle='#e4e8e9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W*.5,y);ctx.lineTo(W*.5,y+32);ctx.stroke()}

const {width:worldW,height:worldH,contact}=FlightWorld;
const stickElement=document.getElementById('dock-stick');
const stick=createDockingControls(stickElement,stickElement.firstElementChild);
let targetSatellite, insertionWaypoint, insertionAltitude=0;
function placeDockingStick(){
  stick.place(screenX(targetSatellite.x),screenY(targetSatellite.y),W,H);
}
addEventListener('resize',()=>{if(state==='DOCKING')placeDockingStick()});
const port={get x(){return targetSatellite.x-32},get y(){return targetSatellite.y}};
const screenX=x=>x*W/worldW;
const screenY=y=>y*H/worldH;
const launchY=()=>worldH*.83-112.2;
let prevState, currState, landingPlume=false;
function snapshot(){
  let x=rocketX,y=rocketY,angle=tilt;
  if(state==='ORBITAL_INSERTION')angle=tilt;
  if(['ASCENT','DOCKING','REENTRY'].includes(state))angle=dynamics.data.angle;
  if(state==='TRANSFER'||state==='DOCKED'){x=port.x;y=port.y;angle=Math.PI/2}
  if(state==='REENTRY'){x=worldW*(.5-phaseTime*.07);y=worldH*(.31+phaseTime*.08)}
  let height=0;
  if(state==='ASCENT')height=ascent/.88;
  if(state==='ORBITAL_INSERTION')height=insertionAltitude;
  if(state==='CRUISE')height=1;
  if(['DOCKING','TRANSFER','DOCKED'].includes(state))height=1;
  if(state==='REENTRY')height=1-.88*FlightAtmosphere.fade(0,2,phaseTime);
  if(state==='MANUAL_CONTROL')height=.12*clamp((contact-y)/(contact-worldH*.47),0,1);
  return {phase:state,x,y,angle,altitude:height*FlightAtmosphere.maxAltitude};
}
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
const horizontal=()=>Number(!!keys.ArrowRight)-Number(!!keys.ArrowLeft);
const vertical=()=>Number(!!keys.ArrowDown)-Number(!!keys.ArrowUp);
function enter(next){
  setState(next);
  phaseTime=0;
  actionHeld=actionPress=false;
  sas.hidden=!['ASCENT','DOCKING','REENTRY'].includes(next);
  stick.reset();
  stickElement.hidden=next!=='DOCKING';
  if(next==='DOCKING'){
    placeDockingStick();
    dynamics.align(Math.PI/2);
  }
  if(next==='REENTRY')dynamics.align(.12);
  sas.textContent='СТАБ. '+({LEVEL:'ВЫРАВНИВАНИЕ',HOLD:'УДЕРЖАНИЕ',PROGRADE:'ПО СКОРОСТИ',RETROGRADE:'ПРОТИВ СКОРОСТИ',OFF:'ВЫКЛ'})[dynamics.mode];
  const labels={ASCENT:'ТЯГА',DOCKING:'ТОРМОЗ',TRANSFER:'ПЕРЕДАТЬ',MANUAL_CONTROL:'ТЯГА'};

      const time=2*height/(vy+Math.sqrt(vy*vy+2*gravity*height));
      const damping=-60*Math.log(drag);
      const predicted=screenX(clamp(rocketX+vx*(1-Math.exp(-damping*time))/damping,18,worldW-18));
      if(recovery())HistoricalSites.landing(ctx,W,H,recovery(),last/1000,width);
      else{
      ctx.fillStyle='#d3e0e8';
      ctx.fillRect(W*(.5-width),pad,W*width*2,7);
      ctx.fillStyle='#283e53';
      ctx.fillRect(W*.5-2,pad,4,7);
      }
      ctx.fillStyle='#ffdf74';
      ctx.beginPath();
      ctx.moveTo(predicted-6,pad-13);
      ctx.lineTo(predicted+6,pad-13);
      ctx.lineTo(predicted,pad-3);
      ctx.fill();
      drawRecoveryCraft(x,landingY(pose.y),pose.angle,rocketY>worldH*.68||landingPlume);
      break;
    }
    case 'ROLLOUT':
    case 'SUCCESS':
    case 'FAILED':
      if(recovery())HistoricalSites.landing(ctx,W,H,recovery(),last/1000,profile().width);
      else drawLaunchpad();
      drawRecoveryCraft(x,pad-15,pose.angle,false);
      break;
  }
  updateEngineAudio(pose);
  playScore();
  drawDebris(alpha);
  effects.draw(ctx);
  ctx.restore();
  FlightAtmosphere.drawClouds(ctx,W,H,view,true);
}
const advance=FlightWorld.clock(dt=>update(dt),render);
function frame(t){
  last=t;
  advance(t);
  requestAnimationFrame(frame);
}
const selecting=()=>['IDLE','SUCCESS','FAILED'].includes(state);
document.getElementById('startBtn').onclick=start;
prevBtn.onclick=()=>select(selected-1);
document.getElementById('nextBtn').onclick=()=>select(selected+1);
document.getElementById('soundBtn').onclick=e=>{
  sound=!sound;
  if(sound)enableAudio();
  else if(audio){
    engineAudio?.update(0,0);
    audio.suspend().catch(()=>{});
  }
  e.currentTarget.textContent=sound?'ЗВУК ВКЛ':'ЗВУК ВЫКЛ';
};
addEventListener('keydown',e=>{
  if(e.target===historyToggle&&e.code==='Space')return;
  if(e.code==='Space'&&['ASCENT','DOCKING','TRANSFER','MANUAL_CONTROL'].includes(state)){
    e.preventDefault();
    keys.Space=true;
    if(!e.repeat)actionPress=true;
    return;
  }
  if(!sas.hidden&&e.code==='KeyS'&&!e.repeat){sas.click();return}
  if(e.code==='KeyQ'||e.code==='KeyE'){keys[e.code]=true;return}
  if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;
  e.preventDefault();
  keys[e.key]=true;
  if(selecting()&&!e.repeat){
    if(e.key==='ArrowLeft')select(selected-1);
    if(e.key==='ArrowRight')select(selected+1);
  }
});
addEventListener('keyup',e=>{delete keys[e.key];delete keys[e.code];if(e.code==='Space')delete keys.Space});
document.addEventListener('visibilitychange',()=>{if(document.hidden){engineAudio?.update(0,0);keys={};pointer=null;actionHeld=actionPress=false;stick.reset()}});
addEventListener('blur',()=>{keys={};pointer=null;actionHeld=false;stick.reset()});
canvas.addEventListener('pointerdown',e=>{
  if(pointer)return;
  canvas.setPointerCapture(e.pointerId);
  pointer={id:e.pointerId,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY};
});
canvas.addEventListener('pointermove',e=>{
  if(pointer?.id!==e.pointerId)return;
  pointer.x=e.clientX;
  pointer.y=e.clientY;
});
canvas.addEventListener('pointerup',e=>{
  if(pointer?.id!==e.pointerId)return;
  const dx=e.clientX-pointer.startX,dy=e.clientY-pointer.startY;
  pointer=null;
  if(!selecting())return;
  if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy))select(selected+(dx<0?1:-1));
  else if(Math.abs(dx)<15&&Math.abs(dy)<15)select(selected+1);
});
function clearPointer(e){if(pointer?.id===e.pointerId)pointer=null}
canvas.addEventListener('pointercancel',clearPointer);
canvas.addEventListener('lostpointercapture',clearPointer);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
action.addEventListener('pointerdown',e=>{
  action.setPointerCapture(e.pointerId);
  actionHeld=true;
});
for(const event of ['pointerup','pointercancel','lostpointercapture']){
  action.addEventListener(event,()=>{actionHeld=false});
}
action.addEventListener('click',()=>{if(state==='TRANSFER')actionPress=true});
updateMeta();
enter('IDLE');
requestAnimationFrame(frame);
</script><script src="js/learning.js"></script><script src="js/mars-landing.js"></script><script src="js/eyes-flight.js"></script></body></html>
